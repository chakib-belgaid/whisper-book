      </g>

      <text x="219" y="266" text-anchor="middle" fill="#526174" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="700" letter-spacing="1">SUPER­TONIC 3 · MEDIA3 · PRIVATE STORAGE</text>
    </g>
  </g>
</svg>
