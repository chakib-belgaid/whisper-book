<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Whisperbook offline preparation and playback pipeline</title>
  <desc id="desc">Seven-stage flow from selecting a local book through extraction, dialogue attribution, speech synthesis, Media3 playback, and checkpointed continuation.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#C8674B"/></marker>
    <style>.title{font:700 34px Georgia,serif;fill:#F7EDD7}.subtitle{font:500 16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#AEBFD2}.n{font:700 14px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#C8674B}.h{font:700 17px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#10253D}.b{font:500 13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#526174}.edge{fill:none;stroke:#C8674B;stroke-width:3;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1200" height="560" rx="28" fill="#10253D"/>
  <text x="56" y="61" class="title">Offline book-to-audio pipeline</text>
  <text x="56" y="90" class="subtitle">The opening chapter is prepared first; later audio is generated progressively and cached.</text>

  <g transform="translate(55 138)">
    <g transform="translate(0 0)"><rect width="142" height="144" rx="18" fill="#F7EDD7"/><text x="18" y="28" class="n">01</text><text x="18" y="61" class="h">Select</text><text x="18" y="86" class="b">Android SAF</text><text x="18" y="107" class="b">PDF or EPUB</text></g>
    <g transform="translate(158 0)"><rect width="142" height="144" rx="18" fill="#F7EDD7"/><text x="18" y="28" class="n">02</text><text x="18" y="61" class="h">Validate</text><text x="18" y="86" class="b">Signature + hash</text><text x="18" y="107" class="b">Private copy</text></g>
    <g transform="translate(316 0)"><rect width="142" height="144" rx="18" fill="#F7EDD7"/><text x="18" y="28" class="n">03</text><text x="18" y="61" class="h">Extract</text><text x="18" y="86" class="b">Chapters + text</text><text x="18" y="107" class="b">OCR if needed</text></g>
    <g transform="translate(474 0)"><rect width="142" height="144" rx="18" fill="#F7EDD7"/><text x="18" y="28" class="n">04</text><text x="18" y="61" class="h">Attribute</text><text x="18" y="86" class="b">Dialogue cues</text><text x="18" y="107" class="b">Voice identity</text></g>
    <g transform="translate(632 0)"><rect width="142" height="144" rx="18" fill="#F7EDD7"/><text x="18" y="28" class="n">05</text><text x="18" y="61" class="h">Synthesize</text><text x="18" y="86" class="b">Supertonic 3</text><text x="18" y="107" class="b">PCM → WAV</text></g>
    <g transform="translate(790 0)"><rect width="142" height="144" rx="18" fill="#F7EDD7"/><text x="18" y="28" class="n">06</text><text x="18" y="61" class="h">Play</text><text x="18" y="86" class="b">Media3 queue</text><text x="18" y="107" class="b">Read-along sync</text></g>
    <g transform="translate(948 0)"><rect width="142" height="144" rx="18" fill="#F7EDD7"/><text x="18" y="28" class="n">07</text><text x="18" y="61" class="h">Continue</text><text x="18" y="86" class="b">Checkpoint</text><text x="18" y="107" class="b">Next prefetch</text></g>
    <path class="edge" d="M142 72H151"/>
    <path class="edge" d="M300 72H309"/>
    <path class="edge" d="M458 72H467"/>
    <path class="edge" d="M616 72H625"/>
    <path class="edge" d="M774 72H783"/>
    <path class="edge" d="M932 72H941"/>

    <path d="M71 189H1019" stroke="#C8A56A" stroke-width="2" stroke-dasharray="7 6" opacity=".75"/>
    <g transform="translate(0 220)">
      <rect width="300" height="86" rx="16" fill="#183A59" stroke="#426985" stroke-width="2"/>
      <text x="22" y="34" fill="#F7EDD7" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="16" font-weight="700">Room database</text>
      <text x="22" y="59" fill="#AEBFD2" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="13">Books · passages · jobs · checkpoints</text>
      <rect x="326" width="300" height="86" rx="16" fill="#183A59" stroke="#426985" stroke-width="2"/>
      <text x="348" y="34" fill="#F7EDD7" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="16" font-weight="700">WorkManager</text>
      <text x="348" y="59" fill="#AEBFD2" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="13">Durable staged preparation + recovery</text>
      <rect x="652" width="438" height="86" rx="16" fill="#183A59" stroke="#426985" stroke-width="2"/>
      <text x="674" y="34" fill="#F7EDD7" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="16" font-weight="700">App-private file storage</text>
      <text x="674" y="59" fill="#AEBFD2" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="13">Imported publication · voice previews · bounded atomic WAV cache</text>
    </g>
  </g>
  <text x="1144" y="525" text-anchor="end" fill="#C8A56A" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" font-weight="700">LOCAL DATA ONLY</text>
</svg>
