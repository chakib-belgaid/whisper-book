    <h1>Chapter Two: A Promise at Dawn</h1>
    <p>At dawn, the trees opened around a quiet pool.</p>
    <p>“I knew the light would guide us,” Elara said.</p>
    <p>Rowan smiled. “Then let us promise to remember the way.”</p>
    <p>Their reflections shimmered as the first birds began to sing.</p>
